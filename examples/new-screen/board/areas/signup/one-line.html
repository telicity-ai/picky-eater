<div class="wrap">
  <div class="signup">
    <h2>Save your seat</h2>
    <p data-pe-not="sent">It is free. Leave your email and we send the ticket.</p>
    <form class="form form--one-line" data-pe-not="sent">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required /></div>
      <button type="button" class="btn" data-pe-go="sent" data-pe-go-invalid="error">Save my seat</button>
      <div data-pe-area="signup-error" data-pe-in="error"></div>
    </form>
    <div data-pe-area="signup-done" data-pe-in="sent"></div>
  </div>
</div>
